<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>איפוס סיסמה | לומדים שוק הון</title><link rel="icon" href="icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090c;--card:#12161b;--tx:#f2f5f7;--mu:#98a3ae;--li:#c8ff3d;--rd:#ff6048}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(700px 400px at 50% 0,rgba(200,255,61,.13),transparent),var(--bg);color:var(--tx);font:17px/1.6 Heebo,system-ui,sans-serif}
.c{width:100%;max-width:420px;text-align:center}.logo{width:76px;height:76px;border-radius:22px;box-shadow:0 0 40px rgba(200,255,61,.3);margin-bottom:10px}
h1{font-size:28px;margin:6px 0 4px}h1 b{color:var(--li)}p{color:var(--mu);margin:0 0 18px}
.box{background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:24px 20px;text-align:right}
label{display:block;font-weight:700;margin:12px 0 6px}input{width:100%;min-height:54px;border-radius:16px;border:1.5px solid #2a323c;background:#0b0e12;color:var(--tx);padding:0 16px;font:inherit;direction:ltr;text-align:right}
input:focus{outline:none;border-color:var(--li);box-shadow:0 0 0 3px rgba(200,255,61,.18)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;margin-top:18px;border:0;border-radius:18px;background:linear-gradient(180deg,#dcff7a,#aee21a);color:#0e1505;font:inherit;font-weight:800;font-size:18px;text-decoration:none;cursor:pointer;box-shadow:0 14px 34px -8px rgba(200,255,61,.5)}
.btn:disabled{opacity:.6;cursor:default}.err{color:var(--rd);min-height:24px;margin-top:10px;font-size:15px}.ok{color:var(--li);font-weight:800;font-size:20px}
.mail{direction:ltr;color:var(--tx);font-weight:700}
</style></head><body><div class="c">
<img class="logo" src="icon-512.png" alt=""><h1>לומדים <b>שוק הון</b></h1>
<div class="box" id="box"><p style="text-align:center">רגע, בודקים את הקישור...</p></div></div>
<script type="module">
const CFG={apiKey:'AIzaSyDJablsF0GQ1xNTHiedOM6cFKCjTWVXsT8',authDomain:'learn-markets.firebaseapp.com',projectId:'learn-markets',appId:'1:228220691798:web:5c3d6002085c61ab0222f7'};
const q=new URLSearchParams(location.search),mode=q.get('mode'),code=q.get('oobCode'),$=s=>document.querySelector(s),box=$('#box');
const APP='app/index.html'+(location.search.includes('ea=')?'':'?ea=1');
const show=h=>box.innerHTML=h;
const bad=(t)=>show(`<p class="ok" style="color:var(--rd)">${t}</p><p>אפשר לבקש קישור חדש במסך הכניסה, בלחיצה על "שכחתי סיסמה". הקישור תקף לזמן מוגבל ואפשר להשתמש בו פעם אחת.</p><a class="btn" href="${APP}">לאפליקציה</a>`);
try{
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  const [{initializeApp},A]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js')]);
  const auth=A.getAuth(initializeApp(CFG)); auth.languageCode='he';
  if(!code){ bad('הקישור לא תקין.'); }
  else if(mode==='resetPassword'){
    let email; try{ email=await A.verifyPasswordResetCode(auth,code); }catch(e){ bad('הקישור פג תוקף או כבר נוצל.'); throw 0; }
    show(`<p style="text-align:center;margin-bottom:6px">בוחרים סיסמה חדשה עבור</p><p class="mail" style="text-align:center">${email.replace(/[<>&"]/g,'')}</p>
      <label for="p1">סיסמה חדשה (לפחות 6 תווים)</label><input id="p1" type="password" autocomplete="new-password">
      <label for="p2">עוד פעם, לאישור</label><input id="p2" type="password" autocomplete="new-password">
      <div class="err" id="e" role="alert"></div><button class="btn" id="go">איפוס סיסמה</button>`);
    const go=async()=>{ const a=$('#p1').value,b=$('#p2').value; const e=$('#e'); e.textContent='';
      if(a.length<6){ e.textContent='הסיסמה צריכה להיות לפחות 6 תווים.'; return; } if(a!==b){ e.textContent='שתי הסיסמאות לא זהות.'; return; }
      const btn=$('#go'); btn.disabled=true; btn.textContent='מאפסים...';
      try{ await A.confirmPasswordReset(auth,code,a); show(`<p class="ok" style="text-align:center">הסיסמה שונתה!</p><p style="text-align:center">עכשיו אפשר להיכנס לאפליקציה עם הסיסמה החדשה.</p><a class="btn" href="${APP}">כניסה לאפליקציה</a>`); }
      catch(err){ btn.disabled=false; btn.textContent='איפוס סיסמה'; e.textContent=err&&err.code==='auth/weak-password'?'הסיסמה חלשה מדי.':'הקישור פג תוקף או כבר נוצל. בקשו קישור חדש.'; } };
    $('#go').onclick=go; $('#p2').onkeydown=ev=>{ if(ev.key==='Enter') go(); };
  } else if(mode==='verifyEmail'){ try{ await A.applyActionCode(auth,code); show(`<p class="ok" style="text-align:center">האימייל אומת!</p><a class="btn" href="${APP}">לאפליקציה</a>`); }catch(e){ bad('הקישור פג תוקף או כבר נוצל.'); } }
  else { bad('פעולה לא מוכרת.'); }
}catch(e){ if(e!==0) show('<p class="ok" style="color:var(--rd);text-align:center">לא הצלחנו לטעון. בדקו חיבור לאינטרנט ונסו שוב.</p>'); }
</script></body></html>
