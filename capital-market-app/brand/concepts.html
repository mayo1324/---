<!doctype html><html dir="rtl" lang="he"><meta charset="utf-8"><style>
body{margin:0;background:#0b0e12;font-family:Heebo,Arial,sans-serif;color:#eee;padding:28px;width:1240px}
h1{margin:0 0 22px;font-size:26px}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.t{background:#12171d;border-radius:22px;padding:22px;text-align:center}.t .n{color:#c8ff3d;font-weight:800;font-size:18px;margin-bottom:4px}.t p{margin:6px 0 16px;color:#98a3ae;font-size:14px;min-height:40px}
.ic{width:190px;height:190px;margin:0 auto 18px;border-radius:44px;display:block}
.lock{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px;border-radius:16px;background:#0b0e12}.lock .ic{width:46px;height:46px;border-radius:12px;margin:0}.lock b{font-size:21px;font-weight:800}.lock b i{font-style:normal;color:#c8ff3d}
.row{display:flex;gap:10px;justify-content:center;margin-top:12px}.row .ic{width:54px;height:54px;border-radius:13px;margin:0}
</style>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaff8a"/><stop offset=".6" stop-color="#a8d812"/><stop offset="1" stop-color="#6f9a05"/></linearGradient>
<linearGradient id="lime2" gradientUnits="userSpaceOnUse" x1="0" y1="4" x2="0" y2="40"><stop offset="0" stop-color="#f2ffb0"/><stop offset="1" stop-color="#b6ee22"/></linearGradient>
<radialGradient id="dk" cx=".5" cy=".3" r=".9"><stop offset="0" stop-color="#1b2410"/><stop offset="1" stop-color="#07090c"/></radialGradient>
<symbol id="shin-d" viewBox="0 0 48 48"><g fill="none" stroke="#10180a" stroke-linecap="round" stroke-linejoin="round"><path d="M13 19v8.5c0 6 4.5 9.5 11 9.5s11-3.5 11-9.5V15" stroke-width="5.4"/><path d="M24 37V11" stroke-width="5.4"/><path d="M13 14.5v1.5M24 6.5v1.8M35 10.5v1.8" stroke-width="2"/></g></symbol>
<symbol id="shin-l" viewBox="0 0 48 48"><g fill="none" stroke="url(#lime2)" stroke-linecap="round" stroke-linejoin="round"><path d="M13 19v8.5c0 6 4.5 9.5 11 9.5s11-3.5 11-9.5V15" stroke-width="5.4"/><path d="M24 37V11" stroke-width="5.4"/><path d="M13 14.5v1.5M24 6.5v1.8M35 10.5v1.8" stroke-width="2"/></g></symbol>
<symbol id="cap" viewBox="0 0 48 48"><g stroke="#10180a" stroke-linecap="round" stroke-linejoin="round"><path d="M24 11L43 20 24 29 5 20z" fill="#10180a" stroke-width="2.6"/><path d="M13 25v6c0 3 5 6 11 6s11-3 11-6v-6" fill="none" stroke-width="3.6"/><path d="M40 21.5V34" stroke-width="2.4" fill="none"/><rect x="37.4" y="33" width="5.2" height="7" rx="1.6" fill="#10180a" stroke="none"/><path d="M24 4v4" stroke-width="2.4"/></g></symbol>
<symbol id="book" viewBox="0 0 48 48"><g stroke="#10180a" stroke-linecap="round" stroke-linejoin="round"><path d="M24 40C19 36 11 35 5 36V17c6-1 14 0 19 4 5-4 13-5 19-4v19c-6-1-14 0-19 4z" fill="none" stroke-width="3.2"/><path d="M24 21v19" stroke-width="2.6"/><path d="M14 13v3M24 8v3M34 11v3" stroke-width="2"/><rect x="11.5" y="16" width="5" height="9" rx="1.5" fill="#10180a" stroke="none" transform="translate(0,-5) translate(0,0)"/><rect x="21.5" y="11" width="5" height="12" rx="1.5" fill="#10180a" stroke="none" transform="translate(0,-4)"/><rect x="31.5" y="14" width="5" height="9" rx="1.5" fill="#10180a" stroke="none" transform="translate(0,-5)"/></g></symbol>
<symbol id="spark" viewBox="0 0 48 48"><g stroke="#10180a" stroke-linecap="round"><path d="M22 16v22" stroke-width="2.6"/><rect x="15.5" y="22" width="13" height="14" rx="3.4" fill="#10180a" stroke="none"/><path d="M36 6l1.8 5.2L43 13l-5.2 1.8L36 20l-1.8-5.2L29 13l5.2-1.8z" fill="#10180a" stroke="none"/></g></symbol>
<symbol id="steps" viewBox="0 0 48 48"><g fill="#10180a"><rect x="8" y="28" width="8.5" height="12" rx="2.6"/><rect x="19.8" y="20" width="8.5" height="20" rx="2.6"/><rect x="31.5" y="10" width="8.5" height="30" rx="2.6"/><circle cx="12.2" cy="20" r="3.2"/></g></symbol>
</defs></svg>
<h1>כיווני לוגו (באותה פלטת ליים וכהה)</h1><div class="g" id="g"></div>
<script>
const T=[
['1','ש מנרות','האות ש (שוק) שבנויה משלושה נרות. ייחודי וקל לזכירה.','lime','shin-d'],
['2','ש על כהה','אותו רעיון, בגרסה כהה ויוקרתית עם ליים זוהר.','dk','shin-l'],
['3','כובע בוגרים','לימוד + נר: הכובע שלו חוט ונר תלוי כמו פונפון.','lime','cap'],
['4','ספר ונרות','ספר פתוח שממנו עולים שלושה נרות. "לומדים".','lime','book'],
['5','נר וניצוץ','נר בודד עם ניצוץ של הבנה. מינימליסטי.','lime','spark'],
['6','מדרגות','עמודות עולות עם נקודה: התקדמות צעד אחר צעד.','dk','steps']];
const fill=s=>s==='lime'?'url(#lime)':'url(#dk)';
document.getElementById('g').innerHTML=T.map(([n,t,d,bg,sy])=>{const c=bg==='dk'&&sy==='steps'?'<svg class="ic" viewBox="0 0 48 48"><rect width="48" height="48" fill="url(#dk)"/><g fill="url(#lime2)"><rect x="8" y="28" width="8.5" height="12" rx="2.6"/><rect x="19.8" y="20" width="8.5" height="20" rx="2.6"/><rect x="31.5" y="10" width="8.5" height="30" rx="2.6"/><circle cx="12.2" cy="20" r="3.2"/></g></svg>':`<svg class="ic" viewBox="0 0 48 48"><rect width="48" height="48" fill="${fill(bg)}"/><use href="#${sy}"/></svg>`;
return `<div class="t"><div class="n">${n}. ${t}</div><p>${d}</p>${c}<div class="lock">${c.replace('class="ic"','class="ic"')}<b>לומדים <i>שוק הון</i></b></div></div>`}).join('');
</script></html>
