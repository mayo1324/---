<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}
:root{
  --bg:#07090c; --card:rgba(24,29,36,.72); --card2:#1d232b; --line:rgba(255,255,255,.08);
  --text:#f5f7fa; --muted:#98a2b3; --dim:#5f6977;
  --green:#1ff0b0; --green-d:#0f8f68; --green-bg:rgba(31,240,176,.13);
  --red:#ff6048; --red-bg:rgba(255,96,72,.13);
  --gold:#ffc94d; --blue:#6aa8ff; --violet:#a78bfa;
  --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#d9dde3}
body{font-family:'Inter','Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:var(--text);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,select{font:inherit;color:inherit}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 600px at 50% -10%,#f4f6fa,#d4d9e1)}
.phone{position:relative;width:390px;height:844px;background:var(--bg);border-radius:46px;overflow:hidden;box-shadow:0 0 0 10px #05060a,0 40px 80px rgba(20,30,50,.4);display:flex;flex-direction:column;isolation:isolate}
@media (max-width:480px){
  html,body{background:var(--bg)}
  .stage{padding:0;display:block;background:var(--bg)}
  .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}
}
/* living background */
.aurora{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(900px 500px at 50% 120%,#0b1f1a,transparent 60%),var(--bg)}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
.aurora i:nth-child(1){width:340px;height:340px;background:#10d9a0;top:-120px;right:-90px;animation:drift1 16s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:300px;height:300px;background:#4f46e5;top:38%;left:-130px;opacity:.38;animation:drift2 20s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:280px;height:280px;background:#0ea5e9;bottom:-110px;right:-60px;opacity:.3;animation:drift3 18s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(-90px,120px) scale(1.2)}}
@keyframes drift2{to{transform:translate(140px,-90px) scale(1.15)}}
@keyframes drift3{to{transform:translate(-110px,-70px) scale(1.25)}}
#bg{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;-webkit-mask-image:linear-gradient(180deg,transparent 4%,#000 24%,#000 66%,transparent 92%);mask-image:linear-gradient(180deg,transparent 4%,#000 24%,#000 66%,transparent 92%)}
.statusbar{position:relative;z-index:3;flex:none;height:44px;padding:14px 28px 0;display:flex;justify-content:space-between;font-weight:600;font-size:14px;direction:ltr}
.sb-icons{display:flex;gap:5px;align-items:center}
.sb-icons i{display:block;width:16px;height:9px;border-radius:2px;background:var(--text);opacity:.9}
.sb-icons i:first-child{clip-path:polygon(0 100%,25% 100%,25% 70%,50% 70%,50% 40%,75% 40%,75% 0,100% 0,100% 100%)}
.sb-icons .bat{width:22px;border-radius:3px;opacity:.9}
@media (max-width:480px){.statusbar{display:none}.screen{padding-top:calc(8px + env(safe-area-inset-top,0px))}}
.screen{position:relative;z-index:2;flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 20px 28px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.has-tabs{padding-bottom:104px}

/* entrance animation: children rise in one by one */
.anim>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.anim>*:nth-child(2){animation-delay:.05s}.anim>*:nth-child(3){animation-delay:.1s}.anim>*:nth-child(4){animation-delay:.15s}
.anim>*:nth-child(5){animation-delay:.2s}.anim>*:nth-child(6){animation-delay:.25s}.anim>*:nth-child(7){animation-delay:.3s}
.anim>*:nth-child(n+8){animation-delay:.35s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:999px;font-weight:700;font-size:16px;transition:transform .12s,opacity .2s,box-shadow .25s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#46f7c4,#12c98e);color:#03231a;box-shadow:0 10px 30px rgba(31,240,176,.38),inset 0 1px 0 rgba(255,255,255,.4);animation:glow 3.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 12px 40px rgba(31,240,176,.6),inset 0 1px 0 rgba(255,255,255,.4)}}
.btn.ghost{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--text)}
.btn.sell{background:linear-gradient(135deg,#ff7a63,#e5432d);color:#fff;box-shadow:0 10px 28px rgba(255,96,72,.35)}
.btn[disabled]{opacity:.35;pointer-events:none;animation:none}
.btn.small{height:46px;font-size:15px}
.icon-btn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.link{color:var(--green);font-weight:600;font-size:14px;text-shadow:0 0 14px rgba(31,240,176,.35)}
.top{display:flex;align-items:center;justify-content:space-between;height:48px;margin-bottom:6px;gap:10px}
.top h2{font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.eyebrow{color:var(--muted);font-size:13px}
h1{font-size:28px;line-height:1.2;font-weight:800}
.up{color:var(--green)} .down{color:var(--red)} .gold{color:var(--gold)}
.gtext{background:linear-gradient(90deg,#fff 10%,#8dffdc);-webkit-background-clip:text;background-clip:text;color:transparent}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);animation:ping 1.8s infinite;vertical-align:middle}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(31,240,176,.7)}80%,100%{box-shadow:0 0 0 9px rgba(31,240,176,0)}}
.fu{animation:fu .7s}.fd{animation:fd .7s}
@keyframes fu{0%{color:var(--green);text-shadow:0 0 12px var(--green)}}
@keyframes fd{0%{color:var(--red);text-shadow:0 0 12px var(--red)}}

/* onboarding */
.ob{display:flex;flex-direction:column;height:100%;min-height:740px}
.ob-top{display:flex;justify-content:space-between;padding:8px 4px}
.ob-art{margin:6px 0 0;background:linear-gradient(160deg,rgba(31,240,176,.12),rgba(24,29,36,.7) 50%);backdrop-filter:blur(10px);border-radius:30px;height:380px;position:relative;overflow:hidden;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.4)}
.ob-art>svg.scene{position:absolute;inset:0;width:100%;height:100%}
.cn{transform-origin:center bottom;transform-box:fill-box;animation:grow .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes grow{from{transform:scaleY(0);opacity:0}to{transform:none;opacity:1}}
.ob-card{position:absolute;bottom:22px;left:22px;background:rgba(35,40,47,.85);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:12px 16px;box-shadow:0 14px 34px rgba(0,0,0,.5);min-width:150px;animation:float 4s ease-in-out infinite}
.ob-card b{display:block;font-size:20px;margin-top:4px;color:var(--gold);letter-spacing:2px}
@keyframes float{50%{transform:translateY(-8px)}}
.ob h1{text-align:center;margin-top:30px;font-size:26px}
.ob p{text-align:center;color:var(--muted);margin:12px 18px 0;line-height:1.55;font-size:15px}
.dots{display:flex;gap:7px;justify-content:center;margin:24px 0 20px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.14);transition:.3s}
.dots i.on{background:var(--green);width:24px;border-radius:5px;box-shadow:0 0 12px var(--green)}
.ob .grow{flex:1}

/* forms */
.field{margin-top:16px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
.inp{width:100%;height:56px;border-radius:18px;background:rgba(255,255,255,.05);border:1.5px solid var(--line);padding:0 16px;font-size:16px;outline:0;transition:border .2s,box-shadow .2s}
.inp:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(31,240,176,.12)}
.inp.err{border-color:var(--red)}
.err-t{color:var(--red);font-size:13px;margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 16px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:14px;color:var(--muted);font-weight:500;white-space:nowrap;transition:.2s}
.chip.on{background:var(--green-bg);border-color:var(--green);color:var(--green);box-shadow:0 0 16px rgba(31,240,176,.2)}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:18px;font-size:13px;color:var(--muted);line-height:1.5;text-align:right}
.check i{flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--dim);display:grid;place-items:center;margin-top:1px}
.check.on i{background:var(--green);border-color:var(--green)}
.check.on i::after{content:"";width:9px;height:5px;border:2px solid #04251b;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}

/* cards */
.card{background:linear-gradient(160deg,rgba(32,38,47,.78),rgba(17,21,27,.78));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 12px 32px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.05)}
button.card{display:block;width:100%;text-align:right}
.hello{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#46f7c4,#0b8a66);display:grid;place-items:center;font-weight:800;color:#04251b;font-size:18px;box-shadow:0 0 22px rgba(31,240,176,.45);flex:none}
.avatar.big{width:88px;height:88px;font-size:36px;margin-bottom:12px}
.hello .t{flex:1;text-align:right}
.hello .t b{display:block;font-size:18px}
.pill{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:700;font-size:14px}
.pill svg{width:16px;height:16px}
.pill.gold{color:var(--gold);box-shadow:0 0 16px rgba(255,201,77,.18)}
.ticker{overflow:hidden;direction:ltr;margin:0 -20px 16px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ticker .tr{display:flex;gap:10px;width:max-content;animation:marq 55s linear infinite}
@keyframes marq{to{transform:translateX(-50%)}}
.tk{display:flex;gap:8px;align-items:baseline;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:12.5px;white-space:nowrap}
.tk b{font-weight:700}.tk i{font-style:normal;color:var(--muted)}.tk em{font-style:normal;font-weight:600}
.hero{background:linear-gradient(135deg,#0d4a3a,#12161c 55%,#2a2470);background-size:180% 180%;animation:shift 12s ease-in-out infinite alternate;border:1px solid rgba(31,240,176,.25);border-radius:28px;padding:18px;position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.4),0 0 40px rgba(31,240,176,.12)}
@keyframes shift{to{background-position:100% 100%}}
.hero::after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(31,240,176,.3),transparent 65%);top:-100px;left:-70px;animation:float 6s ease-in-out infinite;pointer-events:none}
.hero h3{font-size:21px;margin:8px 0 4px;position:relative}
.hero p{color:#b6c2cf;font-size:14px;position:relative}
.hero .row2{display:flex;align-items:center;gap:14px;margin:16px 0;position:relative}
.hero .btn{position:relative}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#46f7c4,#1ff0b0);border-radius:8px;box-shadow:0 0 12px var(--green);transition:width .8s}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--green);background:var(--green-bg);padding:5px 10px;border-radius:999px;position:relative}
.sec{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}
.sec h3{font-size:18px;font-weight:700;display:flex;gap:8px;align-items:center}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.mini .card{padding:14px}
.mini .big{font-size:26px;font-weight:800;margin-top:6px}
.mbig{font-size:22px;font-weight:800;margin-top:6px}
.wcard{display:flex!important;align-items:center;justify-content:space-between;margin-top:14px;background:linear-gradient(135deg,rgba(99,102,241,.35),rgba(17,21,27,.8) 70%)}
.wcard.locked{background:linear-gradient(135deg,rgba(100,116,139,.25),rgba(17,21,27,.8))}
.wcard.locked .wbig{opacity:.55}
.wbig{font-size:32px;font-weight:800;letter-spacing:-.5px;margin:2px 0}
.wr{width:52px;height:52px;border-radius:18px;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none}
.wr svg{width:26px;height:26px;color:var(--green)}
.wcard.locked .wr svg{color:var(--muted)}

/* rows (assets, positions) */
.rows .row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:right}
.rows .row:last-child{border:0}
.rows .row:active{opacity:.7}
.logo{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none;box-shadow:0 0 18px rgba(255,255,255,.08),inset 0 -6px 12px rgba(0,0,0,.25)}
.rows .nm{flex:1;min-width:0}
.rows .nm b{display:block;font-size:15px}
.rows .nm span{font-size:12.5px;color:var(--muted)}
.px{text-align:left;direction:ltr}
.px b{display:block;font-size:15px}
.px span{font-size:12.5px}
.spark{flex:none}
.demo-note{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.5}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px 0 4px}
.filters::-webkit-scrollbar{display:none}
.search{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-radius:18px;background:rgba(255,255,255,.06);border:1.5px solid var(--line);margin-top:14px;color:var(--muted)}
.search svg{width:20px;height:20px;flex:none}
.search input{flex:1;background:none;border:0;outline:0;font-size:15px;color:var(--text)}
.search:focus-within{border-color:var(--green)}
.mk-hero{background:linear-gradient(135deg,rgba(31,240,176,.18),rgba(17,21,27,.8) 65%)}
.mk-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.mk-big{font-size:34px;font-weight:800;direction:ltr;text-align:right}

/* lesson list */
.les{display:flex;gap:14px;align-items:center;padding:14px;border-radius:var(--r);background:linear-gradient(160deg,rgba(32,38,47,.7),rgba(17,21,27,.7));backdrop-filter:blur(10px);border:1px solid var(--line);margin-bottom:12px;text-align:right;width:100%;transition:transform .15s,border-color .2s}
.les:active{transform:scale(.98)}
.les .ic{width:48px;height:48px;border-radius:16px;background:var(--green-bg);display:grid;place-items:center;flex:none}
.les .ic svg{width:24px;height:24px}
.les .tx{flex:1;min-width:0}
.les .tx b{display:block;font-size:16px}
.les .tx span{font-size:13px;color:var(--muted)}
.les.done{border-color:rgba(31,240,176,.35)}
.les.done .ic{background:var(--green);box-shadow:0 0 18px rgba(31,240,176,.5)}
.les .st{font-size:12px;color:var(--green);font-weight:700}
.les.pos .px b{font-size:15px}
.prog-card{margin-bottom:0}

/* lesson player */
.prog{display:flex;gap:5px;margin:4px 0 18px}
.prog i{flex:1;height:5px;border-radius:4px;background:rgba(255,255,255,.1);transition:.4s}
.prog i.on{background:var(--green);box-shadow:0 0 10px var(--green)}
.slide{background:linear-gradient(160deg,rgba(32,38,47,.8),rgba(17,21,27,.8));backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:28px;padding:22px;min-height:480px;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.slide h2{font-size:24px;line-height:1.25;margin:10px 0}
.slide p{color:#e1e5eb;line-height:1.7;font-size:17px}
.slide .vis{margin:18px 0;background:rgba(0,0,0,.28);border-radius:20px;height:210px;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.slide .vis svg{width:100%;height:100%}
.slide .warn{margin-top:14px;font-size:13px;color:var(--gold);background:rgba(255,201,77,.1);border:1px solid rgba(255,201,77,.25);padding:10px 12px;border-radius:12px;line-height:1.5}
.slide .grow{flex:1}
.slide .opt{display:block;width:100%;text-align:right;padding:15px 16px;border-radius:16px;background:rgba(255,255,255,.06);border:1.5px solid var(--line);margin-top:10px;font-size:15px;font-weight:500}
.opt.ok{border-color:var(--green)!important;background:var(--green-bg)!important}
.opt.bad{border-color:var(--red)!important;background:var(--red-bg)!important}
.nav2{display:flex;gap:10px;margin-top:16px}
.nav2 .btn:first-child{flex:1}
.nav2 .btn#pv{flex:none}

/* practice */
.pr-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pr-head .tt{flex:1}
.pr-head b{display:block;font-size:17px}
.pr-head span{font-size:12.5px;color:var(--muted)}
.pbox{background:linear-gradient(160deg,rgba(26,32,40,.85),rgba(12,15,19,.85));backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:26px;padding:14px 10px 10px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.pbox .meta{display:flex;justify-content:space-between;align-items:flex-end;padding:0 8px 10px;direction:ltr}
.pbox .price{font-size:30px;font-weight:800;letter-spacing:-.5px}
.pbox .hl{font-size:12px;color:var(--muted);text-align:right}
.chart{width:100%;height:auto;display:block;touch-action:none;direction:ltr;user-select:none;-webkit-user-select:none}
.chart.swap{animation:swap .5s}
@keyframes swap{from{opacity:.2;transform:scale(.985)}}
.steps{display:flex;justify-content:space-between;margin:14px 2px 10px}
.steps span{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--dim);flex:1}
.steps i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.steps .on{color:var(--text)}.steps .on i{background:var(--green);color:#04251b;box-shadow:0 0 14px var(--green);border-color:transparent}
.steps .done i{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.panel{background:linear-gradient(160deg,rgba(32,38,47,.8),rgba(17,21,27,.8));border:1px solid var(--line);border-radius:22px;padding:16px}
.panel h3{font-size:18px;margin-bottom:6px}
.panel p{font-size:14px;line-height:1.55;margin-bottom:12px}
.opts{display:grid;gap:8px}
.panel .opt{width:100%;text-align:right;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.06);border:1.5px solid var(--line);font-size:15px;font-weight:500;transition:.2s}
.panel .opt.sel{border-color:var(--green);background:var(--green-bg);color:var(--green);box-shadow:0 0 18px rgba(31,240,176,.18)}
.ro{margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.3);font-size:14px;line-height:1.6;color:var(--muted)}
.ro b{color:var(--text)}
.pnav{display:flex;gap:10px;margin-top:14px}
.pnav .btn{flex:1}
.hint{margin-top:12px;background:rgba(255,201,77,.1);border:1px solid rgba(255,201,77,.25);color:var(--gold);padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.5}
.howto .how{display:grid;gap:10px;margin:12px 0}
.howto .how div{display:flex;gap:12px;align-items:center;font-size:14.5px}
.howto .how i{width:26px;height:26px;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;flex:none}

/* feedback */
.fb{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:8px}
.fb .big-ic{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;margin:10px 0 16px}
.fb .big-ic svg{width:52px;height:52px}
.fb.ok .big-ic{background:var(--green-bg);box-shadow:0 0 0 12px rgba(31,240,176,.07),0 0 70px rgba(31,240,176,.35);animation:pulse 2.4s ease-in-out infinite}
.fb.no .big-ic{background:var(--red-bg);box-shadow:0 0 0 12px rgba(255,96,72,.07),0 0 60px rgba(255,96,72,.28)}
@keyframes pulse{50%{box-shadow:0 0 0 18px rgba(31,240,176,.04),0 0 90px rgba(31,240,176,.5)}}
.fb.ok h1{color:var(--green);text-shadow:0 0 28px rgba(31,240,176,.4)}.fb.no h1{color:var(--red)}
.stars{display:flex;gap:10px;margin:14px 0 6px;direction:ltr}
.stars svg{width:44px;height:44px;filter:drop-shadow(0 0 8px rgba(255,201,77,.5))}
.stars .pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
.pnl,.alt{width:100%;margin-top:14px;text-align:right}
.pnl .wbig{font-size:30px}
.altrow{display:flex;gap:8px;margin:10px 0;direction:ltr}
.altrow i{flex:1;height:38px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-weight:800;background:rgba(255,255,255,.07)}
.altrow .target{background:var(--green-bg);color:var(--green)}.altrow .stop{background:var(--red-bg);color:var(--red)}
.checks{width:100%;margin-top:16px;text-align:right}
.ck{display:flex;gap:12px;padding:14px;background:linear-gradient(160deg,rgba(32,38,47,.78),rgba(17,21,27,.78));border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
.ck .m{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px}
.ck.ok .m{background:var(--green);color:#04251b}
.ck.no .m{background:var(--red);color:#fff}
.ck b{display:block;font-size:15px}
.ck span{font-size:13.5px;color:var(--muted);line-height:1.5}
.fb .btns{width:100%;display:grid;gap:10px;margin-top:16px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.confetti i{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(900px) rotate(540deg);opacity:.2}}
.unlock{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:linear-gradient(135deg,rgba(99,102,241,.35),rgba(17,21,27,.8))}
.unlock svg{width:34px;height:34px;color:var(--green)}

/* profile */
.pf{display:flex;flex-direction:column;align-items:center;margin:10px 0 20px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat3 .card{text-align:center;padding:14px 6px}
.stat3 b{display:block;font-size:24px;font-weight:800}
.stat3 span{font-size:12px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:linear-gradient(160deg,rgba(32,38,47,.78),rgba(17,21,27,.78));border:1px solid var(--line);border-radius:18px;padding:14px 6px;text-align:center;font-size:12.5px}
.badge i{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;margin:0 auto 8px;background:var(--green-bg);font-style:normal;font-size:22px;box-shadow:0 0 18px rgba(31,240,176,.2)}
.badge.off{opacity:.35;filter:grayscale(1)}
.disc{font-size:12px;color:var(--dim);line-height:1.6;margin-top:22px;text-align:center}

/* asset detail */
.as-t{flex:1;text-align:center;min-width:0}.as-t b{display:block;font-size:16px}.as-t span{font-size:12px;color:var(--muted)}
.as-price{display:flex;align-items:center;justify-content:space-between;margin:6px 4px 12px;direction:ltr}
.as-price #pp{font-size:40px;font-weight:800;letter-spacing:-1px}
.chgchip{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;background:rgba(255,255,255,.08)}
.chgchip.up{background:var(--green-bg);color:var(--green)}.chgchip.down{background:var(--red-bg);color:var(--red)}
.tfs{display:flex;gap:6px;background:rgba(255,255,255,.06);padding:4px;border-radius:16px;border:1px solid var(--line)}
.tf{flex:1;padding:9px 0;border-radius:12px;font-size:13px;font-weight:600;color:var(--muted);text-align:center;transition:.2s}
.tf.on{background:var(--green);color:#03231a;box-shadow:0 0 18px rgba(31,240,176,.45)}
.cbox{margin-top:12px;background:linear-gradient(160deg,rgba(26,32,40,.85),rgba(12,15,19,.85));border:1px solid var(--line);border-radius:24px;padding:12px 8px 10px;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.tip{display:flex;flex-wrap:wrap;gap:4px 12px;padding:0 8px 8px;font-size:11.5px;color:var(--muted);direction:rtl;min-height:38px;align-content:flex-start}
.tip b{color:var(--text);font-weight:600;direction:ltr;display:inline-block}.tip .tl{color:var(--green);font-weight:700}
.ctl{display:flex;gap:8px;align-items:center;padding:8px 6px 0}
.seg{display:flex;background:rgba(255,255,255,.07);border-radius:12px;padding:3px;margin-inline-end:auto}
.seg button{padding:6px 14px;border-radius:9px;font-size:12.5px;color:var(--muted);font-weight:600}
.seg .on{background:rgba(255,255,255,.14);color:var(--text)}
.tg{padding:7px 12px;border-radius:12px;font-size:12.5px;color:var(--muted);background:rgba(255,255,255,.06);border:1px solid var(--line);font-weight:600}
.tg.on{color:var(--gold);border-color:var(--gold);background:rgba(255,201,77,.1)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stats div{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stats span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}.stats b{font-size:16px;direction:ltr;display:inline-block}
.buybar{position:sticky;bottom:-14px;display:grid;grid-template-columns:1fr 1.6fr;gap:10px;padding:14px 0 6px;margin-top:10px;background:linear-gradient(0deg,rgba(7,9,12,.96) 60%,transparent)}
.as{padding-bottom:6px}

/* sheet */
.sheet{position:absolute;inset:0;z-index:30;display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:.25s}
.sheet.open .sheet-bg{opacity:1}
.sheet-body{position:relative;width:100%;max-height:92%;overflow-y:auto;background:linear-gradient(180deg,#1b2129,#10141a);border-top:1px solid var(--line);border-radius:30px 30px 0 0;padding:22px 20px 26px;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 60px rgba(0,0,0,.6)}
.sheet.open .sheet-body{transform:none}
.sheet-body h3{font-size:20px;margin-bottom:4px}
.lbl{display:block;font-size:13px;color:var(--muted);margin:16px 0 8px}
.lbl b{color:var(--text);font-size:15px}
input[type=range]{width:100%;accent-color:var(--green);height:30px}
.sumr{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted);margin-top:4px}
.sumr b{color:var(--text);direction:ltr;text-align:right}
.info{margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(106,168,255,.1);border:1px solid rgba(106,168,255,.25);color:#b5d2ff;font-size:13.5px;line-height:1.5}
.lockbox{text-align:center;padding:10px 4px}
.lockbox svg{width:44px;height:44px;color:var(--gold);margin-bottom:8px}
.lockbox p{margin:8px 0 18px;line-height:1.6}

/* portfolio */
.vbadge{font-size:12px;font-weight:700;color:var(--gold);padding:6px 12px;border-radius:999px;background:rgba(255,201,77,.1);border:1px solid rgba(255,201,77,.3)}
.pf-hero{background:linear-gradient(135deg,rgba(99,102,241,.3),rgba(17,21,27,.82) 65%)}
.pf-hero .wbig{font-size:40px;direction:ltr;text-align:right}
.pf-row{display:flex;gap:10px;align-items:center;margin:4px 0 10px}
.eqc{height:90px;width:100%}
.alloc{display:flex;height:14px;border-radius:8px;overflow:hidden;gap:2px;direction:ltr}
.alloc i{display:block;min-width:3px;transition:width .8s}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:50%}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border:0}.hrow b{font-size:14.5px}.hrow div span{display:block;font-size:12.5px;color:var(--muted)}
.hrow>b{direction:ltr}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:26px 16px}
.empty svg{width:34px;height:34px;color:var(--green)}
.lockhero{text-align:center;margin:10px 0 20px}
.lk-ring{position:relative;width:160px;height:160px;margin:0 auto}
.lk-ring svg{width:100%;height:100%}
.lk-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.lk-in svg{width:34px;height:34px;color:var(--muted)}.lk-in b{font-size:20px}

/* tabbar */
.tabbar{position:absolute;z-index:10;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:14px;right:14px;height:70px;background:rgba(18,22,28,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:28px;display:flex;justify-content:space-around;align-items:center;padding:0 6px;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.tabbar[hidden]{display:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--dim);flex:1;padding:8px 0;border-radius:18px;text-align:center;transition:color .2s}
.tab svg{width:24px;height:24px;transition:transform .2s}
.tab.on{color:var(--green)}.tab.on svg{transform:translateY(-2px);filter:drop-shadow(0 0 8px var(--green))}
.tab.mid{flex:none;width:60px;height:60px;border-radius:22px;background:linear-gradient(135deg,#46f7c4,#12c98e);color:#04251b;margin-top:-28px;box-shadow:0 12px 28px rgba(31,240,176,.5);justify-content:center;gap:0;animation:glow 3.2s ease-in-out infinite}
.tab.mid span{display:none}.tab.mid.on svg{filter:none}
.toast{position:absolute;bottom:104px;left:50%;transform:translate(-50%,20px);background:rgba(40,46,55,.95);backdrop-filter:blur(10px);border:1px solid var(--line);color:var(--text);padding:12px 18px;border-radius:16px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* keep signed numbers and money readable inside Hebrew sentences */
b,.chgchip,[data-chg],.px span{unicode-bidi:isolate}
.chgchip,[data-chg]{direction:ltr;display:inline-block}
bdi{unicode-bidi:isolate}

/* glossary */
.term{display:inline;color:var(--green);border-bottom:1.5px dashed rgba(31,240,176,.7);font-weight:inherit;font-size:inherit;padding:0 1px;line-height:inherit;text-align:inherit}
.learn{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;font-size:12.5px;color:var(--muted)}
.lchip{padding:6px 12px;border-radius:999px;background:rgba(31,240,176,.09);border:1px solid rgba(31,240,176,.3);color:var(--green);font-size:12.5px;font-weight:600}
.qm{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted);display:grid;place-items:center;flex:none}
.tsheet{z-index:35}
.sheet-body .def{font-size:16px;line-height:1.65;color:#d6dbe3;margin-top:6px}
.sheet-body .vis{margin:14px 0;background:rgba(0,0,0,.3);border-radius:18px;height:150px;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.sheet-body .vis svg{width:100%;height:100%}
.sheet-body .ex{font-size:14px;line-height:1.6;color:var(--muted);background:rgba(255,255,255,.05);border-radius:14px;padding:12px 14px}
.sheet-body .ex b{color:var(--text)}
.grow-row{display:flex;gap:12px;align-items:center;justify-content:space-between;width:100%;padding:14px 0;border-bottom:1px solid var(--line);text-align:right}
.grow-row:last-child{border:0}
.grow-row b{display:block;font-size:16px;margin-bottom:2px}
.grow-row span{font-size:13px;color:var(--muted);line-height:1.5;display:block}
.grow-row svg{width:18px;height:18px;color:var(--dim);flex:none;transform:scaleX(-1)}
.gl-link{display:flex!important;align-items:center;gap:14px;margin-bottom:14px}
.gl-link>div:first-child{width:46px;height:46px;border-radius:16px;background:rgba(31,240,176,.13);display:grid;place-items:center;color:var(--green);flex:none}
.gl-link svg{width:24px;height:24px}
.gl-link b{display:block;font-size:16px}.gl-link span{font-size:13px}
.need{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:12px 14px;margin-bottom:14px;border-radius:16px;background:rgba(255,201,77,.09);border:1px solid rgba(255,201,77,.28);font-size:13.5px;line-height:1.5}
.need b{color:var(--gold);flex-basis:100%}.need span{flex:1;min-width:150px;color:#e8d9a8}.need .btn{width:auto;padding:0 20px}
.vbadge{background:rgba(255,201,77,.1)}

/* practice: clear task box */
.task .tk-n{display:inline-block;font-size:12px;font-weight:700;color:var(--green);background:var(--green-bg);padding:4px 10px;border-radius:999px;margin-bottom:8px}
.task h3{font-size:19px;line-height:1.35;margin-bottom:6px}
.task p{font-size:14.5px;color:#cbd2dc;line-height:1.6;margin-bottom:12px}
.riskgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.riskgrid .rk{padding:12px;border-radius:16px;background:rgba(255,255,255,.06);border:1.5px solid var(--line);text-align:center;transition:.2s}
.riskgrid .rk b{display:block;font-size:20px}.riskgrid .rk span{font-size:12.5px;color:var(--muted)}
.riskgrid .rk.on{border-color:var(--green);background:var(--green-bg);box-shadow:0 0 18px rgba(31,240,176,.18)}
.riskgrid .rk.on b{color:var(--green)}
.riskgrid .rk.warn.on{border-color:var(--red);background:var(--red-bg)}.riskgrid .rk.warn.on b{color:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.two div{padding:10px 12px;border-radius:14px;text-align:center;font-size:13px;color:var(--muted)}
.two b{display:block;font-size:17px;direction:ltr}
.two .w{background:var(--green-bg)}.two .w b{color:var(--green)}.two .l{background:var(--red-bg)}.two .l b{color:var(--red)}
.pulse{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.steps2{display:grid;gap:12px;margin:14px 0}
.steps2 div{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.5}
.steps2 i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--green);color:#03231a;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:14px}
.verdict{width:100%;text-align:right;margin-top:14px}
.verdict b{font-size:16px}.verdict p{font-size:14.5px;color:#cbd2dc;line-height:1.65;margin-top:6px}

/* ===== screen transitions ===== */
.screen{transition:opacity .17s ease,transform .17s ease,filter .17s ease}
.screen.leaving{opacity:0;transform:translateY(8px) scale(.985);filter:blur(4px)}
.screen.entering{animation:enter .5s cubic-bezier(.2,.9,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
.sweep{position:absolute;inset:0;z-index:25;pointer-events:none;opacity:0;background:linear-gradient(112deg,transparent 28%,rgba(31,240,176,.16) 42%,rgba(167,139,250,.22) 54%,transparent 68%)}
.sweep.run{animation:sweep .62s ease-out}
@keyframes sweep{0%{opacity:0;transform:translateX(-110%)}25%{opacity:1}100%{opacity:0;transform:translateX(110%)}}
.spk{position:absolute;z-index:50;width:7px;height:7px;border-radius:50%;pointer-events:none;animation:spk .7s ease-out forwards;box-shadow:0 0 8px currentColor}
@keyframes spk{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0}}

/* ===== artwork animation ===== */
.scene{width:100%;height:100%;display:block}
.drift{animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.bob{animation:bob 2.2s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
.wave{animation:bob .9s ease-in-out infinite alternate}
.float{animation:float2 3.2s ease-in-out infinite alternate}
@keyframes float2{to{transform:translateY(-6px)}}
.tw{animation:tw 2.2s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:1}}
.coin{animation:coin 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes coin{0%,100%{transform:translateY(0) scaleX(1)}50%{transform:translateY(-6px) scaleX(.25)}}
.flag{animation:flag 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left center}
@keyframes flag{to{transform:skewY(6deg) scaleX(.92)}}
.flame{animation:flame .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:top center}
@keyframes flame{to{transform:scaleY(1.5)}}
.swap{animation:tw 1.2s ease-in-out infinite alternate}
.ball{animation:ball 1.7s cubic-bezier(.4,0,.6,1) infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes ball{0%{transform:translateY(-96px)}46%{transform:translateY(0)}50%{transform:translateY(0) scale(1.2,.8)}56%{transform:translateY(-4px) scale(1)}100%{transform:translateY(-96px)}}
.balloon{animation:balloon 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center top}
@keyframes balloon{0%,100%{transform:translateY(0)}48%{transform:translateY(-62px)}52%{transform:translateY(-60px) scale(1.12,.88)}}
.grow{animation:growy 1.1s cubic-bezier(.2,1.3,.4,1) both;transform-box:view-box}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.mascot{display:block;overflow:visible}
.mbob{animation:mbob 2.6s ease-in-out infinite alternate}
@keyframes mbob{to{transform:translateY(-4px)}}
.blink{animation:blink 4.4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.mascot.cheer{animation:jump .9s ease-in-out infinite alternate}
@keyframes jump{from{transform:translateY(0)}to{transform:translateY(-12px)}}
.armL{animation:armL .5s ease-in-out infinite alternate;transform-origin:-36px 24px}
.armR{animation:armR .5s ease-in-out infinite alternate;transform-origin:36px 24px}
@keyframes armL{to{transform:rotate(-16deg)}}@keyframes armR{to{transform:rotate(16deg)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ===== onboarding with mascot ===== */
.ob-art{padding:0;height:400px;background:#150f33}
.ob-art .scene{position:absolute;inset:0}
.ob-mascot{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);filter:drop-shadow(0 14px 18px rgba(0,0,0,.4))}
.ob-bubble{position:absolute;top:22px;left:50%;transform:translateX(-50%);background:#fff;color:#14233a;font-weight:700;font-size:14px;padding:10px 16px;border-radius:18px;white-space:nowrap;box-shadow:0 10px 24px rgba(0,0,0,.35);animation:float2 3s ease-in-out infinite alternate}
.ob-bubble::after{content:"";position:absolute;bottom:-7px;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}

/* ===== lesson player ===== */
.lp .slide{min-height:0;padding:14px 16px 18px}
.slide.in-r{animation:inr .45s cubic-bezier(.2,.9,.2,1)}
.slide.in-l{animation:inl .45s cubic-bezier(.2,.9,.2,1)}
@keyframes inr{from{opacity:0;transform:translateX(-46px) rotate(-1.5deg)}to{opacity:1;transform:none}}
@keyframes inl{from{opacity:0;transform:translateX(46px) rotate(1.5deg)}to{opacity:1;transform:none}}
.scene-card{position:relative;height:210px;border-radius:22px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1)}
.scene-card .cnt{position:absolute;top:10px;right:10px;font-size:11.5px;font-weight:700;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:999px;direction:ltr}
.say{display:flex;gap:6px;align-items:center;margin:8px 0 2px}
.say .m{flex:none;width:76px}
.bubble{position:relative;background:rgba(255,255,255,.1);border:1px solid var(--line);padding:10px 14px;border-radius:18px 18px 18px 4px;font-size:14.5px;font-weight:600;line-height:1.45;color:#eaf2ff;flex:1}
.lp .slide h2{margin:8px 0}
.lp .slide p{font-size:16.5px}
.prog i.cur{animation:curp 1.2s ease-in-out infinite alternate}
@keyframes curp{to{box-shadow:0 0 16px var(--green);transform:scaleY(1.5)}}
.toy{margin-top:14px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.toy-v{height:120px;border-radius:12px;overflow:hidden}
.toy-p{margin:8px 0;font-size:15px;color:var(--muted)}
.toy-p b{font-size:22px;direction:ltr;display:inline-block}
.toy-b{display:flex;gap:8px;justify-content:center}
.toy-b .chip{font-size:15px;padding:11px 20px}

/* ===== lesson complete ===== */
.ldone{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:14px}
.rays{position:absolute;top:-60px;left:50%;width:520px;height:520px;margin-left:-260px;background:repeating-conic-gradient(from 0deg,rgba(255,201,77,.16) 0 10deg,transparent 10deg 24deg);-webkit-mask-image:radial-gradient(circle,#000 8%,transparent 62%);mask-image:radial-gradient(circle,#000 8%,transparent 62%);animation:spin 24s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.ldone>*:not(.rays){position:relative}
.dm{margin:10px 0 4px;filter:drop-shadow(0 18px 24px rgba(0,0,0,.45))}
.xpc{width:100%;margin-top:14px;text-align:right}
.xpt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.xpt b{font-size:24px;color:var(--gold);direction:ltr}
.xpc .bar{margin-bottom:8px}.xpc .bar i{transition:width 1.1s cubic-bezier(.2,.9,.2,1)}
.lvlup{color:var(--gold);font-weight:800;animation:pop .6s both}
.fb-m{margin:6px 0 4px;filter:drop-shadow(0 14px 18px rgba(0,0,0,.4))}
.xp-row{display:flex;align-items:center;gap:10px;margin:-4px 0 14px;font-size:12.5px;font-weight:700;color:var(--gold)}
.xp-row .bar{height:6px}

.ob-bubble{left:0;right:0;margin:0 auto;transform:none;width:max-content;max-width:84%;white-space:normal;text-align:center}
.ob-bubble::after{left:50%}
.ldone .btns{width:100%;display:grid;gap:10px}

/* ===== professional illustration language ===== */
.cn{transform-origin:center bottom;transform-box:fill-box;animation:growc .7s cubic-bezier(.2,.9,.3,1) both}
@keyframes growc{from{transform:scaleY(.1);opacity:0}to{transform:none;opacity:1}}
.bar{animation:barin .8s cubic-bezier(.2,.9,.3,1) both}
@keyframes barin{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
.flow{animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.pulse-r{animation:pr 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pr{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.7);opacity:0}}
.draw{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.6s .2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.seg{animation:seg 1.2s .2s ease both}
@keyframes seg{from{stroke-dasharray:0 314}}
.ob-art{padding:0;height:420px;background:#0d1424;box-shadow:0 24px 60px rgba(0,0,0,.5),0 0 60px rgba(31,240,176,.08)}
.tip-note{display:flex;gap:10px;align-items:center;margin:12px 0 4px;padding:10px 14px;border-radius:14px;background:rgba(255,201,77,.08);border:1px solid rgba(255,201,77,.22);color:#f2e3b5;font-size:13.5px;line-height:1.5}
.tip-note svg{width:18px;height:18px;flex:none;color:var(--gold)}
.toysvg{width:100%;height:auto;display:block;margin-bottom:6px}
.dm{margin:6px 0 4px}
.ringp{animation:ringp 1s .1s ease forwards}.checkp{animation:ringp .5s .9s ease forwards}
@keyframes ringp{to{stroke-dashoffset:0}}

/* illustrations always show in full: box keeps the drawing's 320x200 ratio */
.scene-card{height:auto;aspect-ratio:320/200;background:#0d1424}
.sheet-body .vis{height:auto;aspect-ratio:320/200;display:block}
.sheet-body .vis svg{width:100%;height:100%}

/* drawing tools */
.dtools{display:flex;gap:6px;align-items:center;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.dtools::-webkit-scrollbar{display:none}
.dl{font-size:12.5px;color:var(--muted);flex:none}
.dtb{flex:none;padding:8px 14px;border-radius:12px;font-size:13px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.06);border:1px solid var(--line);transition:.2s}
.dtb.on{color:#1a1204;background:var(--gold);border-color:var(--gold);box-shadow:0 0 16px rgba(255,201,77,.35)}
.dhint{margin-top:10px;font-size:13px;line-height:1.55;color:#d9dee6;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:40px}
.chart.drawing{cursor:crosshair}
.steps{align-items:flex-start;gap:0}
.steps span{min-width:0;font-size:10.5px;text-align:center}
.steps i{width:23px;height:23px;font-size:11px}

/* open position card */
.poscard{margin-top:14px}
.poscard .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pgrid div{background:rgba(255,255,255,.05);border-radius:14px;padding:10px 12px}
.pgrid span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}.pgrid b{font-size:16px;direction:ltr;display:inline-block}
.plv{display:grid;gap:8px;margin:12px 0}
.pl{display:grid;grid-template-columns:14px auto 1fr;gap:4px 10px;align-items:center;padding:10px 12px;border-radius:14px;font-size:13.5px}
.pl i{width:10px;height:10px;border-radius:50%}.pl b{direction:ltr;justify-self:start;font-size:15px}.pl em{grid-column:2/4;font-style:normal;font-size:12px;color:var(--muted)}
.pl.s{background:var(--red-bg)}.pl.s i{background:var(--red)}.pl.t{background:var(--green-bg)}.pl.t i{background:var(--green)}

/* calmer asset screen */
.ctl{justify-content:flex-start;padding:10px 4px 0}
.toolsbtn{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;font-size:13.5px;font-weight:600;color:var(--text);background:rgba(255,255,255,.08);border:1px solid var(--line)}
.toolsbtn svg{color:var(--gold)}
.tip{min-height:24px}
.modebar{margin-top:10px}
.modebarin{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:rgba(255,201,77,.12);border:1px solid rgba(255,201,77,.4);animation:rise .3s both}
.modebarin b{display:block;font-size:14px;color:var(--gold)}.modebarin span{font-size:12.5px;color:#e8d9a8}
.modebarin button{padding:8px 16px;border-radius:999px;background:var(--gold);color:#1a1204;font-weight:700;font-size:13px}
.insight{margin-top:10px;font-size:13px;line-height:1.55;color:#d9dee6;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.insight[hidden]{display:none}
.posstrip{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,rgba(99,102,241,.28),rgba(17,21,27,.8));border:1px solid var(--line);text-align:right}
.posstrip .l{flex:1}.posstrip .l span{display:block;font-size:12px;color:var(--muted)}.posstrip .l b{font-size:15px;direction:ltr;display:inline-block}
.posstrip .lv{display:flex;flex-direction:column;gap:3px}
.posstrip em{font-style:normal;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;direction:ltr;text-align:center}
.posstrip em.s{background:var(--red-bg);color:var(--red)}.posstrip em.t{background:var(--green-bg);color:var(--green)}
.posstrip>svg{width:16px;height:16px;color:var(--dim);flex:none;transform:scaleX(-1)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpis div{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.kpis span{display:block;font-size:11.5px;color:var(--muted);margin-bottom:2px}.kpis b{font-size:14.5px;direction:ltr;display:inline-block}
.morebtn{display:block;width:100%;margin-top:12px;padding:12px;border-radius:14px;font-size:13.5px;font-weight:600;color:var(--green);background:rgba(31,240,176,.07);border:1px dashed rgba(31,240,176,.4);text-align:center}
#moreBox{margin-top:12px}#moreBox[hidden]{display:none}
.drawgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dg{padding:12px 8px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);text-align:center}
.dg b{display:block;font-size:14px}.dg span{font-size:11.5px;color:var(--muted)}
.sheet-body .seg{display:flex;width:max-content}

/* ===== calmer, more inviting home ===== */
.home .hello{margin:4px 0 16px}
.avatar.ringed{position:relative;background:none;box-shadow:none;width:52px;height:52px}

/* ===== screen transitions: directional slide plus a soft ripple from the tapped spot ===== */
.screen{transition:opacity .2s ease,transform .2s cubic-bezier(.4,0,.6,1),filter .2s ease}

/* ===== lesson slide motion: leave, then arrive with a soft spring; swipe to move ===== */
.slide{touch-action:pan-y}
.slide.in-r{animation:inr .55s cubic-bezier(.22,1,.36,1)}
.slide.in-l{animation:inl .55s cubic-bezier(.22,1,.36,1)}
@keyframes inr{from{opacity:0;transform:translateX(-64px) scale(.97)}to{opacity:1;transform:none}}
@keyframes inl{from{opacity:0;transform:translateX(64px) scale(.97)}to{opacity:1;transform:none}}
.slide.out-f{animation:outf .18s cubic-bezier(.4,0,1,1) forwards}
.slide.out-b{animation:outb .18s cubic-bezier(.4,0,1,1) forwards}
@keyframes outf{to{opacity:0;transform:translateX(56px) scale(.98)}}
@keyframes outb{to{opacity:0;transform:translateX(-56px) scale(.98)}}
.slide.in-r>*,.slide.in-l>*{animation:kidin .5s cubic-bezier(.22,1,.36,1) both}
.slide.in-r>*:nth-child(2),.slide.in-l>*:nth-child(2){animation-delay:.04s}
.slide.in-r>*:nth-child(3),.slide.in-l>*:nth-child(3){animation-delay:.08s}
.slide.in-r>*:nth-child(n+4),.slide.in-l>*:nth-child(n+4){animation-delay:.12s}
@keyframes kidin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide.in-r,.slide.in-l,.slide.in-r>*,.slide.in-l>*{animation:none}}

function initBg() {
  const cv = $('#bg'); if (!cv || !cv.getContext) return;

  fit(); addEventListener('resize', fit);

  let p = 0;
  const mk = () => { const o = p; p = p * .94 + (r() - .46) * 30; return { o, c: p, h: Math.max(o, p) + 6 + r() * 14, l: Math.min(o, p) - 6 - r() * 14 }; };

    if (document.hidden) return requestAnimationFrame(draw);

    if (!reduceMotion) { off += dt * 0.008; if (off >= SL) { off -= SL; cs.shift(); cs.push(mk()); } }
    ctx.clearRect(0, 0, W, H);
    const base = H * .56, k = 1.7;
    cs.forEach((c, i) => {
      const x = i * SL - off + 8, up = c.c >= c.o, col = up ? '31,240,176' : '255,96,72';
      const g = ctx.createLinearGradient(0, base - c.h * k, 0, base - c.l * k);
      g.addColorStop(0, `rgba(${col},.2)`); g.addColorStop(1, `rgba(${col},.05)`);
      ctx.strokeStyle = `rgba(${col},.26)`; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, base - c.h * k); ctx.lineTo(x, base - c.l * k); ctx.stroke();
      const y1 = base - Math.max(c.o, c.c) * k, y2 = base - Math.min(c.o, c.c) * k, bh = Math.max(6, y2 - y1);
      ctx.fillStyle = g; ctx.strokeStyle = `rgba(${col},.3)`; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x - 13, y1, 26, bh, 6) : ctx.rect(x - 13, y1, 26, bh); ctx.fill(); ctx.stroke();
    });

  }

}

    wrong: () => note(230, 0, .2, 'sine', .45, 175),
    pop: () => { note(700, 0, .08, 'sine', .35, 920); },
    star: () => { note(N.A5, 0, .12, 'triangle', .4); note(N.E6, .07, .2, 'sine', .3); },
    good: () => { [N.C5, N.E5, N.G5].forEach((f, k) => note(f, k * .09, .22, 'triangle', .5)); },
    oops: () => { note(N.G4, 0, .2, 'sine', .4); note(N.E4, .14, .3, 'sine', .4); },

const TF_SIGMA = { '1D': .0011, '1W': .0026, '1M': .0085, '3M': .0095, '1Y': .0115 };

function genSeries(a, tf) {
  const cfg = TF.find(t => t[0] === tf), n = cfg[2];
  const r = rng(a.seed * 13 + TF.indexOf(cfg) * 7 + 3);
  const sg = TF_SIGMA[tf] * a.vol, drift = a.trend * sg * .12;
  let p = 100; const cs = [];
  for (let i = 0; i < n; i++) {
    const o = p, c = o * (1 + (r() - .5) * 2 * sg + drift);
    const h = Math.max(o, c) * (1 + r() * sg * .7), l = Math.min(o, c) * (1 - r() * sg * .7);
    cs.push({ o, c, h, l, v: Math.round(40 + r() * 60 + Math.abs(c - o) / o / sg * 25) }); p = c;
  }
  const k = a.price / cs[n - 1].c;
  cs.forEach(c => { c.o *= k; c.c *= k; c.h *= k; c.l *= k; });
  return cs;
}

function sellPos(ac, id, qty, why) {
  const a = byId(id), pos = ac.portfolio.pos[id]; if (!pos) return 0;
  qty = Math.min(qty, pos.qty); const gain = qty * (a.price - pos.avg);
  ac.portfolio.cash += qty * a.price; pos.qty -= qty;
  if (pos.qty < 0.0001) delete ac.portfolio.pos[id];
  ac.portfolio.hist.unshift({ t: Date.now(), type: 'sell', id, qty, price: a.price, pnl: gain, why: why || '' });

/* ----- tap particles ----- */
function burst(x, y, color = GR, n = 10) {
  if (reduceMotion) return;
  const ph = $('#phone').getBoundingClientRect();
  for (let i = 0; i < n; i++) {
    const s = document.createElement('i'); s.className = 'spk';
    const a = Math.PI * 2 * i / n + Math.random() * .6, d = 22 + Math.random() * 22;
    s.style.cssText = `left:${x - ph.left}px;top:${y - ph.top}px;background:${color};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px`;
    $('#phone').appendChild(s); setTimeout(() => s.remove(), 700);
  }
}
document.addEventListener('pointerdown', (e) => { const b = e.target.closest('.btn.primary,.opt,.rk,.chip,.tab'); if (b) burst(e.clientX, e.clientY, GR, 5); });

screens.lesson = (id) => {
  const L = LESSONS.find(x => x.id === id) || LESSONS[0];
  if (!lessonOpen(L)) { scr.innerHTML = ''; setTimeout(() => { toast('השיעור הזה ייפתח אחרי שמסיימים את הנושא הקודם'); go('lessons'); }, 0); return; }
  let i = 0, answered = false, dir = 1;
  let busy = false;
  /* leave the current slide first, then bring the next one in (RTL: forward comes from the left) */
  const step = (d, fromX) => {
    if (busy) return; const el = $('.slide');
    if (!el || reduceMotion) { i += d; dir = d; draw(); return; }
    busy = true;
    if (fromX == null) { el.style.animation = 'none'; el.classList.remove('in-r', 'in-l'); el.classList.add(d > 0 ? 'out-f' : 'out-b'); }
    else { el.style.transition = 'transform .18s ease-in, opacity .18s ease-in'; el.style.transform = `translateX(${d > 0 ? 90 : -90}px)`; el.style.opacity = 0; }
    setTimeout(() => { i += d; dir = d; busy = false; draw(); }, 180);
  };
  const swipe = (el, quiz) => {
    let sx = 0, dx = 0, on = false;
    el.addEventListener('pointerdown', (e) => { if (busy || e.target.closest('button,input,.toy,.opt')) return; on = true; sx = e.clientX; dx = 0; el.style.transition = 'none'; });
    el.addEventListener('pointermove', (e) => {
      if (!on) return; dx = e.clientX - sx;
      const fwdOk = !quiz && dx > 0, backOk = i > 0 && !quiz && dx < 0, k = (fwdOk || backOk) ? .7 : .18;
      el.style.transform = `translateX(${dx * k}px) rotate(${dx * k * .02}deg)`; el.style.opacity = 1 - Math.min(.5, Math.abs(dx) / 420);
    });
    const end = () => {
      if (!on) return; on = false;
      const d = dx > 0 ? 1 : -1, ok = d > 0 ? !quiz : (i > 0 && !quiz);
      if (Math.abs(dx) > 70 && ok) step(d, dx);
      else { el.style.transition = 'transform .4s cubic-bezier(.34,1.56,.64,1), opacity .3s'; el.style.transform = ''; el.style.opacity = ''; }
    };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  };
  const QS = L.qs || [L.q], ords = [];
  const shuf = (n) => { const o = Array.from({ length: n }, (_, k) => k); for (let k = o.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [o[k], o[j]] = [o[j], o[k]]; } return o; };
  const n = L.slides.length + QS.length, say = SAY[L.id] || [];
  const draw = () => {
    const quiz = i >= L.slides.length, sl = L.slides[i], qi = i - L.slides.length, Q = quiz ? QS[qi] : null;
    answered = false; if (quiz && !ords[qi]) ords[qi] = shuf(Q.o.length);
    scr.innerHTML = `<div class="lp">
      <div class="top"><button class="icon-btn" id="bk">${ic.x}</button><span class="muted" style="font-size:13px">${L.title}</span><span style="width:42px"></span></div>
      <div class="prog">${Array.from({ length: n }, (_, k) => `<i class="${k < i ? 'on' : k === i ? 'on cur' : ''}"></i>`).join('')}</div>
      <div class="slide ${dir > 0 ? 'in-r' : 'in-l'}">${quiz
        ? `<span class="tag">בדיקה קטנה${QS.length > 1 ? ` ${qi + 1} מתוך ${QS.length}` : ''}</span><h2>${Q.q}</h2><div class="grow">${ords[qi].map(k => `<button class="opt" data-k="${k}">${Q.o[k]}</button>`).join('')}</div><div id="qm" class="muted" style="margin-top:14px;min-height:22px"></div>`
        : `<div class="scene-card">${sceneSVG(sl.v)}<span class="cnt">${i + 1}/${L.slides.length}</span></div>
           ${say[i] ? `<div class="tip-note">${ic.bulb}<span>${say[i]}</span></div>` : ''}
           <h2>${sl.t}</h2><p>${sl.b}</p>${toyHTML(sl.x)}${sl.w ? `<div class="warn">${sl.w}</div>` : ''}<div class="grow"></div>`}</div>
      <div class="nav2">${i > 0 && !quiz ? `<button class="btn ghost" id="pv" style="flex:none;width:90px">חזרה</button>` : ''}<button class="btn primary" id="nx" ${quiz ? 'disabled' : ''}>${quiz && qi === QS.length - 1 ? 'סיום שיעור' : 'הבא'}</button></div></div>`;
    scr.scrollTop = 0;
    $('#bk').onclick = () => go('lessons');
    const pv = $('#pv'); if (pv) pv.onclick = () => step(-1);
    if (!quiz) bindToy(sl.x, scr);
    swipe($('.slide'), quiz);
    $('#nx').onclick = () => {
      if (!quiz || qi < QS.length - 1) { step(1); return; }
      const s = A(), first = !s.lessonsDone.includes(L.id), openBefore = activeMods().filter(modOpen).map(m => m.id);
      if (first) { s.lessonsDone.push(L.id); s.stars += 1; s.xp = (s.xp || 0) + 20; save(); }
      markActive(s);
      const unlocked = activeMods().filter(modOpen).map(m => m.id).find(mid => !openBefore.includes(mid));
      go('lessonDone', { id: L.id, gained: first ? 20 : 0, before: (s.xp || 0) - (first ? 20 : 0), unlocked });
    };

  ['תוכן לימודי בלבד, ללא ייעוץ', 'כל מה שמופיע באפליקציה הוא תוכן לימודי כללי. אין בו ייעוץ השקעות, שיווק השקעות, ניהול תיקי השקעות או המלצה לקנות, למכור או להחזיק נייר ערך כלשהו, ואין לראות בו תחליף לייעוץ מקצועי המתחשב בנתונים האישיים שלכם. מפעילי האפליקציה אינם מציגים את עצמם כבעלי רישיון לייעוץ השקעות. לפני כל החלטה כספית אמיתית יש להתייעץ עם גורם מוסמך.'],

  ['תרגול וכסף וירטואלי', 'התיק והתרגול באפליקציה הם סימולציה בכסף וירטואלי. אין בהם כסף אמיתי, והתוצאות בהם אינן מעידות על תוצאות אמיתיות. בתרגול משתמשים בנתוני שוק אמיתיים מהעבר, בלי שם הנכס והתאריך עד סוף המקרה. החלטה "נכונה" בתרגול נקבעת לפי כללי לימוד שהוגדרו מראש ולא לפי התוצאה בדיעבד, והיא אינה המלצה לפעול כך במציאות.'],
  ['נתונים ומקורות', 'נתוני השוק בתרגול הם נתוני עבר שהתקבלו משירות Yahoo Finance. הם נועדו לבדיקה פרטית בלבד, לא להפצה, ועלולים להכיל אי דיוקים. לשונית "שוק" מציגה נתוני הדגמה בדויים. תוכן השיעורים נכתב על סמך מקורות ציבוריים, בעיקר אתר Investor.gov של רשות ניירות הערך האמריקאית וערכים בוויקיפדיה. הוא טיוטה שלא נבדקה על ידי מומחה, ואינו כולל כללים ספציפיים לישראל כגון מסים. המנוי והתשלום באפליקציה הם הדגמה בלבד.'],
  ['גיל ושימוש', 'השימוש מיועד לבני 15 ומעלה. מי שטרם מלאו לו 18 מצהיר שהוריו או אפוטרופסו מודעים לשימוש שלו באפליקציה. אין להשתמש באפליקציה לשום מטרה בלתי חוקית, ואין לנסות לשבש את פעולתה.'],
  ['פרטיות ונתונים אישיים', 'בהרשמה רגילה אפשר להזין שם, גיל, אימייל וסיסמה. אלה נשמרים רק בדפדפן שלכם, והסיסמה נשמרת בצורה פשוטה שאינה מאובטחת באמת, ולכן אל תשתמשו בסיסמה שאתם משתמשים בה במקום אחר. אם תתחברו עם Google, נקבל מהחשבון שלכם את השם והאימייל, ונשמור אותם יחד עם ההתקדמות (שיעורים, כוכבים, תוצאות תרגול) בשירותי Firebase של Google, במסד נתונים באזור תל אביב. הנתונים האלה משמשים רק כדי שההתקדמות תישמר בין מכשירים. אנחנו לא מוכרים אותם ולא משתמשים בהם לפרסום. אפשר למחוק את החשבון והנתונים בענן בכל עת דרך "על גרסת הניסוי" בפרופיל. ההתחברות עם Apple היא הדגמה ואינה מחוברת לחשבון אמיתי.'],

  ['הגבלת אחריות', 'האפליקציה ניתנת "כפי שהיא", בלי התחייבות לדיוק, לשלמות או לזמינות. ככל שהדין מתיר, מפעילי האפליקציה לא יישאו באחריות לנזק או להפסד כלשהם, ישירים או עקיפים, הנובעים מהשימוש באפליקציה או מהסתמכות על התוכן שבה, ובכלל זה החלטות כספיות. השימוש הוא באחריות המשתמש.'],
  ['שינויים בתנאים', 'ייתכן שנעדכן את התנאים האלה. בשינוי מהותי נבקש את אישורכם מחדש.'],
  ['דין ויצירת קשר', 'על התנאים האלה יחול הדין הישראלי. שאלות והערות אפשר לשלוח דרך כפתור "משוב" באפליקציה.']
];
const termsOk = () => { const t = loadDB().terms; return !!(t && t.v === TERMS_VERSION); };
screens.terms = (mode) => {
  const view = mode === 'view', t = loadDB().terms;
  scr.innerHTML = `<div class="anim terms">
    ${view ? `<div class="top"><button class="icon-btn" id="tbk" aria-label="חזרה">${ic.back}</button><h2>תנאי שימוש ופרטיות</h2><span style="width:42px"></span></div>` : `<div class="tlogo">${authLogo ? authLogo() : ''}</div><h1 class="th">לפני שמתחילים</h1><p class="muted tsub">קראו ואשרו את תנאי השימוש והפרטיות. זה לוקח דקה.</p>`}
    <div class="tsum">${TERMS_SUMMARY.map(([h, p]) => `<div><b>${h}</b><span>${p}</span></div>`).join('')}</div>
    <div class="tfull"><h3>התקנון המלא</h3><span class="muted tver">גרסת ניסוי · תנאים מגרסה ${TERMS_VERSION} · ${BUILD_DATE}</span>
      ${TERMS_TEXT.map(([h, p], i) => `<section><h4>${i + 1}. ${h}</h4><p>${p}</p></section>`).join('')}</div>
    ${view ? `<p class="muted tver" style="text-align:center">${t ? 'אושר בתאריך ' + new Date(t.at).toLocaleDateString('he-IL') : ''}</p>` : `<div class="tend" id="tend">
      <button class="check" id="tc1" type="button"><i></i><span>קראתי והבנתי את תנאי השימוש והפרטיות. אני מבין/ה שהתוכן באפליקציה לימודי בלבד ואינו ייעוץ השקעות או המלצה.</span></button>
      <button class="check" id="tc2" type="button"><i></i><span>אני בן/בת 15 ומעלה. אם אני מתחת ל-18, ההורה או האפוטרופוס שלי יודעים שאני משתמש/ת באפליקציה.</span></button>
      <div class="slide2 off" id="sl" role="slider" tabindex="0" aria-label="החליקו לאישור והמשך" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="sl-fill"></div><span class="sl-txt" id="slt">סמנו את שתי התיבות כדי לאשר</span>
        <div class="sl-knob" id="slk"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></div></div></div>`}
  </div>${view ? '' : '<button class="tgo" id="tgo" type="button">קפצו לסוף ואשרו <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>'}`;
  if (view) { $('#tbk').onclick = () => go('profile'); return; }
  const st = { a: false, b: false, done: false }, sl = $('#sl'), knob = $('#slk'), fill = $('.sl-fill', sl), KW = 56;
  const unlocked = () => st.a && st.b;
  const upd = () => { sl.classList.toggle('off', !unlocked()); $('#slt').textContent = unlocked() ? 'החליקו לאישור' : 'סמנו את שתי התיבות כדי לאשר'; };
  const setP = (p) => { const max = sl.clientWidth - KW - 8; knob.style.transform = `translateX(${-p * max}px)`; fill.style.width = (KW + 8 + p * max) + 'px'; sl.setAttribute('aria-valuenow', Math.round(p * 100)); $('#slt').style.opacity = 1 - Math.min(1, p * 1.6); };
  const finish = () => {
    if (st.done) return; st.done = true; setP(1); sl.classList.add('ok'); knob.innerHTML = '<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'; $('#slt').textContent = 'אושר!'; $('#slt').style.opacity = 1;
    const d = loadDB(); d.terms = { v: TERMS_VERSION, at: new Date().toISOString() }; save(); SFX.play('win');
    if (!reduceMotion) {
      const r = knob.getBoundingClientRect(), ph = $('#phone').getBoundingClientRect(), x = r.left + r.width / 2 - ph.left, y = r.top + r.height / 2 - ph.top;
      const ov = document.createElement('div'); ov.className = 'appr'; ov.style.setProperty('--x', x + 'px'); ov.style.setProperty('--y', y + 'px'); ov.innerHTML = `<i></i><i></i><i></i>${confetti(46)}`; $('#phone').appendChild(ov); setTimeout(() => ov.remove(), 2200);
    }
    setTimeout(() => { scr.onscroll = null; bootRoute(); }, reduceMotion ? 150 : 1150);
  };
  $('#tc1').onclick = () => { st.a = !st.a; $('#tc1').classList.toggle('on', st.a); upd(); };
  $('#tc2').onclick = () => { st.b = !st.b; $('#tc2').classList.toggle('on', st.b); upd(); };
  let drag = null;
  knob.addEventListener('pointerdown', (e) => { if (!unlocked() || st.done) return; drag = { x: e.clientX }; knob.style.transition = fill.style.transition = 'none'; try { knob.setPointerCapture(e.pointerId); } catch (_) { } });
  knob.addEventListener('pointermove', (e) => { if (!drag) return; const max = sl.clientWidth - KW - 8; setP(Math.max(0, Math.min(1, (drag.x - e.clientX) / max))); });
  const end = () => { if (!drag) return; drag = null; const max = sl.clientWidth - KW - 8, cur_ = Math.abs(+(knob.style.transform.match(/-?[\d.]+/) || [0])[0]) / max; knob.style.transition = fill.style.transition = 'transform .4s cubic-bezier(.34,1.56,.64,1), width .4s cubic-bezier(.34,1.56,.64,1)'; if (cur_ >= .9) finish(); else setP(0); };
  knob.addEventListener('pointerup', end); knob.addEventListener('pointercancel', end);
  sl.addEventListener('keydown', (e) => { if (!unlocked()) return; if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowLeft') { e.preventDefault(); finish(); } });
  $('#tgo').onclick = () => scr.scrollTo({ top: scr.scrollHeight, behavior: reduceMotion ? 'auto' : 'smooth' });
  scr.onscroll = () => { const near = scr.scrollHeight - scr.scrollTop - scr.clientHeight < 140; $('#tgo') && $('#tgo').classList.toggle('gone', near); };
};

'use strict';
/* after the terms are approved (or if they already were), go to the right first screen */
function bootRoute() {
  const d = loadDB(), h = (location.hash || '').replace('#', '');
  const open = ['home', 'lessons', 'market', 'portfolio', 'practiceHome', 'profile'];
  if (loggedIn()) go(open.includes(h) ? h : 'home');
  else go(Object.keys(d.accounts).length ? 'login' : d.seenOnboarding ? 'signup' : 'onboarding', 0);
}
(function boot() {
  initBg();
  if (!termsOk()) go('terms'); else bootRoute();
  if (termsOk()) cloudResume();
})();

</script>
